function closeNet(){try{if(PEER)PEER.destroy()}catch(e){}PEER=null;NET=null;try{if(window.BC)window.BC.close()}catch(e){}window.BC=null}
function loadPeer(cb){if(window.Peer)return cb();var s=document.createElement("script");s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";s.onload=cb;s.onerror=function(){oops(t("loaderr"))};document.head.appendChild(s)}
function openNet(host){var code=S.code,local=location.hash.indexOf("local")>-1;
function wire(send){NET={send:send};if(!host)send({t:"join"})}
if(local){var bc=new BroadcastChannel("aat-"+code);window.BC=bc;bc.onmessage=function(e){onData(e.data)};wire(function(m){bc.postMessage(m)});return}
loadPeer(function(){var id="aaghaaz-tamasha-"+code;
if(host){PEER=new Peer(id);PEER.on("connection",function(c){c.on("open",function(){wire(function(m){c.send(m)})});c.on("data",onData);c.on("close",onClose)});PEER.on("error",function(e){if(e.type=="unavailable-id"){S.code=rnd4();V="host";render();openNet(true)}else oops(t("connprob",{e:e.type}))})}
else{PEER=new Peer();PEER.on("open",function(){var c=PEER.connect(id,{reliable:true});c.on("open",function(){wire(function(m){c.send(m)})});c.on("data",onData);c.on("close",onClose)});PEER.on("error",function(e){oops(e.type=="peer-unavailable"?t("notfound",{c:code}):t("connprob",{e:e.type}))})}})}
function onData(m){if(m.t=="join"&&S.mode=="host"){NET.send({t:"start",role:S.role,seed:S.seed,len:S.len});begin()}
else if(m.t=="start"&&S.mode=="guest"){S.role=m.role=="B"?"G":"B";S.seed=m.seed;S.len=m.len;begin()}
else if(m.t=="pick"&&S.cur){S.theirs[m.id]={o:m.o,r:m.r};if(S.cur.id==m.id&&S.mine[m.id]&&!S.done[m.id])reveal()}
else if(m.t=="again"){S.seed=m.seed||S.seed;begin()}}
function onClose(){if(!S||!S.online)return;S.online=false;var w=document.createElement("div");w.className="warn";w.textContent=t("discon");w.style.cssText="position:absolute;z-index:9;top:84px;left:8px;right:8px;text-align:center";document.getElementById("game").appendChild(w);setTimeout(function(){w.remove()},6000);
if(S.cur&&!S.theirs[S.cur.id]){S.theirs[S.cur.id]=ai(S.cur);if(S.mine[S.cur.id])reveal()}}
function replayOnline(){S.seed=1+Math.floor(Math.random()*1e9);if(NET)NET.send({t:"again",seed:S.seed});begin()}
