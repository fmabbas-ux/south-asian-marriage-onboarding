body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.btn.alt{text-align:center;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none}
.tag{display:inline-block;background:var(--gold);color:#2b1a1f;font-weight:700;font-size:.75rem;padding:2px 10px;border-radius:99px}
.mute{color:var(--mute);font-size:.9rem}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 8px}
.m{font-size:.7rem;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.s i{background:var(--red)}
.chips span{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:8px;font-size:.8rem;background:var(--line)}
.up{color:var(--good)}.dn{color:var(--bad)}
.rate{display:flex;gap:8px}.rate button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.rate button.on{background:var(--gold);border-color:var(--gold);color:#2b1a1f;font-weight:700}
.k{background:var(--maroon);color:#fff;border-radius:16px;padding:20px 14px;text-align:center;margin:10px 0}
.k h2{font-size:1.7rem;color:#fff}.k .ur{font-size:1.4rem}
input{width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:1.3rem}
.code{font-family:ui-monospace,Consolas,monospace;font-size:2rem;letter-spacing:.3em;text-align:center;background:var(--bg);border:2px dashed var(--gold);padding:10px;border-radius:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .card{margin:6px 0}
.warn{background:#fff0cc;color:#5a4200;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9rem}
.foot{text-align:center;margin:20px 0 8px}

{r:"bed",x:[],w:"Wedding night",t:"Night one",
b:"It's 2 a.m. after a fourteen-hour wedding. Your feet hurt, the jewellery is heavy, and the man beside you is still half a stranger. Everyone said tonight is 'special'. You mostly want to sleep, and you also don't want to disappoint him.",
g:"It's 2 a.m. You've smiled at six hundred guests and your friends have been winking all week. Your wife looks exhausted. You feel an unspoken pressure about tonight and you're not sure what she expects.",
o:[{t:"Go along with what you think is expected, and say nothing.",s:"p",e:[-1,-3,0,0,0,2],c:"The night passes. Neither of you knows what the other really wanted, and a quiet distance begins."},
{t:"Say it out loud: 'I'm exhausted and nervous. Can we just talk and sleep tonight?'",s:"k",e:[3,2,0,0,0,-3],c:"A pause, then relief on both sides. You laugh about the day together. First private joke unlocked."},
{t:"Make a joke, change the subject, and never come back to it.",s:"a",e:[0,-1,0,0,0,1],c:"The joke lands. The question stays unanswered and returns on night three."},
{t:"Get irritated that the evening isn't going as imagined.",s:"r",e:[-3,-1,0,0,0,3],c:"Your tone chills the room. The first night is remembered for the wrong reason."}],

{r:"liv",x:["hamza"],say:["hamza","Bhai, shop ke paise ka shukriya!"],w:"Month 3",t:"The family-money surprise",
b:"You find out your husband sent money to his brother's shop without telling you. It's his salary, but it's also your household. You feel like a guest in your own finances.",
g:"Your brother asked for help and it felt natural to send it. Your wife seems upset about something you consider family duty, and you feel judged.",
o:[{t:"Demand that all support to the extended family stops.",s:"r",e:[-3,0,-2,-1,1,3],c:"It lands as 'your family doesn't matter'. Words sharpen, and by evening a parent has heard about it."},
{t:"Say nothing and quietly start hiding some of your own money.",s:"a",e:[-3,0,0,0,-1,1],c:"Secrets become the new currency. Trust is what they cost."},
{t:"Say: 'Helping family is good. Let's agree an amount together and tell each other first.'",s:"k",e:[3,1,0,0,2,-2],c:"A rule instead of a fight. The monthly money chat becomes a habit that saves you later."},
{t:"Agree to anything and resent it quietly.",s:"p",e:[-1,-3,1,0,-1,2],c:"You keep the peace on the surface, and the resentment compounds like interest."}],
n:"Money fights are rarely about money; they're about who counts. Agree an amount and a 'tell each other first' rule instead of arguing over whose family deserves what."},

{r:"bed",x:[],cat:1,w:"Month 2",t:"The silent two days",

o:[{t:"Keep the silence going until the other person apologises first.",s:"r",e:[-3,0,0,0,0,3],c:"Day four. Nobody is winning, and both of you are lonely in the same flat."},
{t:"Apologise for everything just to end it.",s:"p",e:[1,-3,0,0,0,-1],c:"Peace returns fast, but the real issue is buried and you feel a little smaller."},
{t:"Act as if nothing happened and carry on.",s:"a",e:[-1,0,0,0,0,1],c:"Life resumes politely. The Friday issue is still sitting there."},
{t:"Say: 'I need twenty minutes, then I want to finish this talk,' and actually come back.",s:"k",e:[3,1,0,0,0,-2],c:"You both return. Twenty minutes of calm does what two days of silence couldn't."}],
n:"Taking a break is a skill; vanishing is a punishment. Say how long you need and come back at that time."},

{r:"bed",x:["mil"],say:["mil","Beta, chai piyogi?"],w:"Day 9",t:"The 7 a.m. knock",
b:"Your mother-in-law opens your bedroom door without knocking to ask if you want tea. You were changing. You smile, but your chest is tight, and you don't know if this is normal in this house.",
g:"Your mother has always walked into your room, and you've never thought about it. Your wife has gone quiet at breakfast and you don't know why.",

{t:"Handle it kindly.",tb:"Pick a calm moment, share how it felt, and ask your husband to warmly raise a 'knock first' habit with his mother.",tg:"Ask your wife what's bothering her, listen, then warmly raise a 'knock first' habit with your mother yourself.",s:"k",e:[3,1,0,0,0,-1],c:"It's raised kindly by her own child, the habit changes, and nobody loses face."}],

{t:"Cook only exactly the way she says from now on.",s:"p",e:[0,-3,1,1,0,2],c:"Fewer comments, and a growing feeling that your hands are not your own."},
{t:"Handle it warmly.",tb:"Ask your husband to thank his mother, give her a dish she owns (her Friday biryani), and tell her plainly that your cooking suits your home.",tg:"Thank your mother warmly, give her a dish she owns (her Friday biryani), and tell her plainly your wife's cooking suits you.",s:"k",e:[2,1,2,1,0,-2],c:"Your mother (or mother-in-law) gets a role to shine in, and the comments thin out. The kitchen starts to feel shared."},

{r:"yard",x:["mil","bmom"],say:["bmom","Eid pe ghar aana, beta!"],w:"Month 4",t:"Whose Eid first?",

{t:"Give up your own family's Eid to keep everyone calm.",s:"p",e:[-1,-3,-1,1,0,2],c:"One family is happy. You are not, and your own parents hear it in your voice."},

{r:"liv",x:["fil"],say:["fil","Beta, tankhwah ghar ke kharche mein, theek?"],w:"Month 5",t:"The salary question",

o:[{t:"Hand over everything and say nothing more.",s:"p",e:[-2,-3,2,1,-2,2],c:"The elders are delighted. By month six you can't afford anything that's yours."},
{t:"Agree a clear split together (household, parents' support, your savings), then share it respectfully with the elders and ask for their dua.",s:"k",e:[3,1,0,0,3,-2],c:"A plan, not a rebellion. Elders accept a number delivered with respect far more easily than a surprise."},
{t:"Announce your money is your own, full stop.",s:"r",e:[-2,1,-3,-2,1,3],c:"The house hears 'we don't trust you'. Your father stops talking to you for a week."},
{t:"Delay the talk until someone explodes.",s:"a",e:[-1,-1,-1,0,-1,2],c:"The explosion comes at a wedding, with an audience."}],
n:"Present a plan, not a position. Elders often reject ultimatums and accept clear plans delivered with respect."},

{r:"liv",x:["hamza","sana"],say:["hamza","Bhai... meri fees due hain."],w:"Month 6",t:"The younger brother's fees",
b:"Your husband's younger brother needs semester fees. The family glances at your husband, and a little at your salary.",
g:"Your younger brother's fees are due and everyone looks at you. You want to help, but you haven't spoken to your wife about it.",
o:[{t:"Refuse: 'It's not our responsibility.'",s:"r",e:[-1,0,-3,-3,1,3],c:"The word 'stingy' travels fast. Your spouse is embarrassed in front of the family."},
{t:"Agree a limit together (an amount and a duration), then tell the family kindly and clearly.",s:"k",e:[3,1,1,0,2,-2],c:"The family gets a clear yes with a boundary. The fee is covered, and everyone knows it isn't unlimited."},
{t:"Say 'we'll see' and leave it hanging.",s:"a",e:[-1,0,-1,-1,-1,2],c:"The deadline passes. Someone else pays, and you carry the shame."},

n:"Support to relatives is a couple decision with a number and a time limit. A clear 'yes, up to here' protects both love and budget."},

{r:"yard",x:["aunty","sana"],say:["aunty","Koi khushkhabri?"],w:"Month 4",t:"Koi khushkhabri?",
b:"At a cousin's dholki, three aunties ask 'Koi khushkhabri?' You smile through the third. In the car afterwards, nobody asks how you felt.",
g:"At the same dholki an uncle jokes about your 'delay'. You laugh with the others, but your wife stiffens beside you.",

g:"You've got an offer abroad, a real chance. You're excited and a little scared. Your parents want you close, her parents are ageing, and you haven't yet asked what she wants.",

n:"Big moves are joint decisions with a review date. A trial period turns an ultimatum into an experiment."},

b:"Nothing is wrong, exactly. But some evenings you cry in the bathroom and then feel guilty: you have a kind husband and a nice home, so why this?",

if(r.type=="sc"){var c=SC[r.i];h='<div class="mute">Situation '+(r.i+1)+" of "+SC.length+" · "+rname(S.role)+(S.online?" · online":" · vs AI partner")+'</div>'+meters()+'<div class="card"><span class="tag">'+c.w+" · "+RM[c.r].n+'</span><h2 style="margin-top:8px">'+c.t+"</h2><p>"+(S.role=="B"?c.b:c.g)+'</p></div><p><b>What do you do?</b></p>';c.o.forEach(function(o,i){h+='<button class="btn" onclick="choose('+i+')">'+otext(o,S.role)+"</button>"})}
else{h='<div class="k"><h2>Khichdi Ban Gayi Hai!</h2><div class="ur">کھچڑی بن گئی ہے!</div><p>Everything has tangled at once. You can only untangle one thread first.</p></div>'+meters()+"<p><b>Which thread do you pull first?</b></p>";KO.forEach(function(o,i){h+='<button class="btn" onclick="choose('+i+')">'+o.t+"</button>"})}
$(h)}
function choose(i){if(S.mine[S.cur.id])return;S.sel=i;if(S.cur.type=="kh")return lock(0);var c=SC[S.cur.i],o=c.o[i];
$('<div class="mute">Situation '+(S.cur.i+1)+" of "+SC.length+"</div>"+meters()+'<div class="card"><span class="tag">'+SN[o.s]+"</span><p><b>You chose:</b> "+otext(o,S.role)+'</p></div><p><b>How stressful would this situation feel to you?</b></p><div class="rate">'+[1,2,3,4,5].map(function(n){return'<button id="r'+n+'" onclick="rate('+n+')">'+n+"</button>"}).join("")+'</div><p class="mute">1 = barely, 5 = very. '+(S.online?"Your partner will not see your answer until you both lock in.":"Your partner is rating too.")+'</p><button id="nx" class="btn main" disabled onclick="lock(S.rt)">Lock in my answer</button><button class="btn alt" onclick="renderRound()">Change my mind</button>')}
function rate(n){S.rt=n;for(var k=1;k<=5;k++)document.getElementById("r"+k).className=k==n?"on":"";document.getElementById("nx").disabled=false}
function lock(r){var id=S.cur.id;if(S.mine[id])return;S.mine[id]={o:S.sel,r:r};if(S.cur.type=="sc")S.styles[SC[S.cur.i].o[S.sel].s]++;if(S.online&&NET)NET.send({t:"pick",id:id,o:S.sel,r:r});check()}
function check(){var id=S.cur.id;if(S.theirs[id])reveal();else $('<div class="card" style="text-align:center"><h2>⏳ Waiting for your partner</h2><p class="mute">They are still thinking about this one. Your answer is locked in.</p></div>'+meters()+'<button class="btn alt" onclick="useAI()">Partner stuck? Continue with an AI partner</button>')}
function useAI(){S.online=false;S.theirs[S.cur.id]=ai(S.cur);reveal()}
var RANK={k:0,p:1,a:2,r:3};
function reveal(){var r=S.cur,id=r.id,a=S.mine[id],b=S.theirs[id],h,eff=[0,0,0,0,0,0],note="",mood="k";
if(r.type=="sc"){var c=SC[r.i],oa=c.o[a.o],ob=c.o[b.o];for(var j=0;j<6;j++)eff[j]=Math.round((oa.e[j]+ob.e[j])/2*5);
if(oa.s=="k"&&ob.s=="k"){eff[0]+=5;eff[5]-=5;note="Team bonus: you both chose skilled. +5 Trust, -5 Stress."}else if((oa.s=="k"&&ob.s=="r")||(oa.s=="r"&&ob.s=="k")){eff[0]-=5;note="Friction: one calm answer met one reactive answer. -5 Trust."}else if(oa.s=="r"&&ob.s=="r"){eff[0]-=5;eff[5]+=5;note="Double reaction. -5 Trust, +5 Stress."}
mood=RANK[oa.s]>=RANK[ob.s]?oa.s:ob.s}
else{var ka=KO[a.o],kb=KO[b.o];for(var j2=0;j2<6;j2++)eff[j2]=Math.round((ka.e[j2]+kb.e[j2])/2);if(a.o==0&&b.o==0){eff[0]+=5;note="You both chose your partner first. +5 Trust."}mood=(a.o==0||b.o==0)?"k":"a"}
if(!S.done[id]){S.done[id]=1;for(var q=0;q<6;q++)S.m[q]=clamp(S.m[q]+eff[q]);
if(r.type=="sc")react(c,a,b,mood);else{stage.kh=0;stage.shake=0;stageSet("yard",["mil","fil"],null,false,false);stage.room=null;camTarget()}}
var br=S.role=="B"?a:b,gr=S.role=="B"?b:a;
h='<div class="mute">'+(r.type=="sc"?"Situation "+(r.i+1)+" of "+SC.length:"Khichdi recovery")+"</div>"+meters();
var bt=function(x,role){return r.type=="sc"?otext(SC[r.i].o[x.o],role):KO[x.o].t},st=function(x){return r.type=="sc"?SN[SC[r.i].o[x.o].s]:"Thread"},cs=function(x){return r.type=="sc"?SC[r.i].o[x.o].c:KO[x.o].c};
h+='<div class="two"><div class="card"><span class="tag">You · '+rname(S.role)+" · "+st(a)+"</span><p>"+bt(a,S.role)+"</p>"+(r.type=="sc"?'<p class="mute">Stress '+a.r+"</p>":"")+'</div><div class="card"><span class="tag">Partner · '+rname(other())+" · "+st(b)+"</span><p>"+bt(b,other())+"</p>"+(r.type=="sc"?'<p class="mute">Stress '+b.r+"</p>":"")+"</div></div>";
h+='<div class="card"><b>What happened</b><p>'+cs(a)+"</p>"+(cs(a)!=cs(b)?'<p class="mute">'+cs(b)+"</p>":"")+'<div class="chips">';
for(var z=0;z<6;z++)if(eff[z]){var good=z==5?eff[z]<0:eff[z]>0;h+='<span class="'+(good?"up":"dn")+'">'+MN[z][1]+" "+MN[z][0]+" "+(eff[z]>0?"+":"")+eff[z]+"</span>"}
h+="</div>"+(note?'<p class="mute">'+note+"</p>":"")+"</div>";
if(r.type=="sc"){if(Math.abs(a.r-b.r)>=2)h+='<div class="warn">Big stress gap ('+a.r+" vs "+b.r+"). Same event, very different feeling. Talk about this one.</div>";h+='<div class="card"><b>The lesson</b><p>'+SC[r.i].n+"</p></div>"}
else h+='<div class="card"><b>The lesson</b><p>One thread at a time, starting with your partner, not the audience.</p></div>';
h+='<button class="btn main" onclick="nextRound()">Next</button>';$(h)}
function react(c,a,b,mood){var br=S.role=="B"?a:b,gr=S.role=="B"?b:a;CHR.bride.mood=c.o[br.o].s;CHR.bride.emo=EM[c.o[br.o].s];CHR.bride.et=6;CHR.groom.mood=c.o[gr.o].s;CHR.groom.emo=EM[c.o[gr.o].s];CHR.groom.et=6;
CHR.bride.say="";CHR.groom.say="";
(c.x||[]).forEach(function(id){var ch=CHR[id];ch.mood=mood;ch.emo=EM[mood];ch.et=6;ch.say=RL[id][mood];ch.st=6});
if(!(c.x||[]).length){}parrot.say=PL[mood];parrot.st=5;cat.emo=mood=="k"?"😺":(mood=="r"?"🙀":"😿");cat.et=5;if(mood=="r")stage.shake=.6}
function nextRound(){var r=S.cur;if(r.type=="kh"){startRound({id:"s"+S.i,type:"sc",i:S.i});return}
S.i++;if(S.i>=SC.length)return end();if(flags()>=3&&S.kc<2&&S.i-S.lastK>1){S.kc++;S.lastK=S.i;startRound({id:"k"+S.kc,type:"kh"})}else startRound({id:"s"+S.i,type:"sc",i:S.i})}
function end(){var e=ENDS.filter(function(x){return x.f(S.m)})[0],top="k";for(var k in S.styles)if(S.styles[k]>S.styles[top])top=k;
stageHome();Object.keys(CHR).forEach(function(id){CHR[id].mood=e.n=="Team Tamasha"||e.n=="Strong but Tired"?"k":(e.n=="Pulled Apart"?"s":"a");CHR[id].emo=CHR[id].mood=="k"?"😊":(CHR[id].mood=="s"?"😢":"😐");CHR[id].et=99});parrot.say=e.n=="Team Tamasha"?"Mubarak ho! Mubarak ho!":"Phir se khelo!";parrot.st=99;
var link=location.origin+location.pathname,wa="https://wa.me/?text="+encodeURIComponent("I played Aaghaaz Tamasha and got: "+e.n+". Play your first year with me: "+link);
var ts={k:0,r:0,a:0,p:0};Object.keys(S.theirs).forEach(function(id){if(id[0]=="s"){var o=SC[+id.slice(1)].o[S.theirs[id].o];ts[o.s]++}});
$('<div class="k" style="margin-top:6px"><div style="opacity:.8">Your first year</div><h2>'+e.n+"</h2><p>"+e.d+"</p></div>"+meters()+'<div class="card"><b>Your instinct pattern</b><p class="mute">Skilled '+S.styles.k+" · Reactive "+S.styles.r+" · Avoidant "+S.styles.a+" · Pleaser "+S.styles.p+"</p><p>"+PAT[top]+'</p><p class="mute">Partner: Skilled '+ts.k+" · Reactive "+ts.r+" · Avoidant "+ts.a+" · Pleaser "+ts.p+'</p></div><a class="btn main" style="text-align:center" href="'+wa+'" target="_blank" rel="noopener">Share on WhatsApp</a><button class="btn alt" onclick="'+(S.online?"replayOnline()":"pick('solo')")+'">Play again</button><button class="btn alt" onclick="home()">Home</button><p class="mute foot">Dehleez · Aaghaaz Tamasha v0.2</p>')}

/* ===================== ONLINE (couple) ===================== */
function closeNet(){try{if(PEER)PEER.destroy()}catch(e){}PEER=null;NET=null;try{if(window.BC)window.BC.close()}catch(e){}window.BC=null}
function rnd4(){var a="ABCDEFGHJKMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function loadPeer(cb){if(window.Peer)return cb();var s=document.createElement("script");s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";s.onload=cb;s.onerror=function(){oops("Could not load the online service. Check your connection, or play solo.")};document.head.appendChild(s)}
function oops(t){$('<div class="warn">'+t+'</div><button class="btn main" onclick="home()">Back</button>')}
function hostUI(){S.online=true;S.code=rnd4();$('<h2>Your room</h2><div class="code" id="rc">'+S.code+'</div><p class="mute" style="text-align:center">Ask your partner to open the game and enter this code, or send them the link. You are the '+rname(S.role)+'.</p><a class="btn main" id="wa" target="_blank" rel="noopener">Send link on WhatsApp</a><button class="btn alt" onclick="copyLink()">Copy link</button><div class="card" id="st" style="text-align:center">⏳ Waiting for your partner to join...</div><button class="btn alt" onclick="home()">Cancel</button>');
var link=location.origin+location.pathname+"?room="+S.code;document.getElementById("wa").href="https://wa.me/?text="+encodeURIComponent("Let's play Aaghaaz Tamasha together. Room "+S.code+": "+link);
openNet(true)}
function copyLink(){try{navigator.clipboard.writeText(location.origin+location.pathname+"?room="+S.code)}catch(e){}}
function joinUI(code){$('<h2>Join your partner</h2><p class="mute">Enter the 4-character room code.</p><input id="jc" maxlength="4" value="'+(code||"")+'" placeholder="ABCD"><button class="btn main" onclick="doJoin()">Join</button><button class="btn alt" onclick="home()">Back</button>');if(code)doJoin()}
function doJoin(){var c=document.getElementById("jc").value.trim().toUpperCase();if(c.length!=4)return;S.code=c;S.online=true;S.mode="guest";$('<div class="card" style="text-align:center"><h2>Joining room '+c+'...</h2><p class="mute">Connecting to your partner.</p></div><button class="btn alt" onclick="home()">Cancel</button>');openNet(false)}
function openNet(host){var code=S.code,local=location.hash.indexOf("local")>-1;
function wire(send){NET={send:send};if(!host)send({t:"join"})}
if(local){var bc=new BroadcastChannel("aat-"+code);window.BC=bc;bc.onmessage=function(e){onData(e.data)};wire(function(m){bc.postMessage(m)});return}
loadPeer(function(){var id="aaghaaz-tamasha-"+code;
if(host){PEER=new Peer(id);PEER.on("connection",function(c){c.on("open",function(){wire(function(m){c.send(m)})});c.on("data",onData);c.on("close",onClose)});PEER.on("error",function(e){if(e.type=="unavailable-id"){S.code=rnd4();hostUI()}else oops("Connection problem: "+e.type)})}
else{PEER=new Peer();PEER.on("open",function(){var c=PEER.connect(id,{reliable:true});c.on("open",function(){wire(function(m){c.send(m)})});c.on("data",onData);c.on("close",onClose)});PEER.on("error",function(e){oops(e.type=="peer-unavailable"?"Room "+code+" not found. Check the code with your partner.":"Connection problem: "+e.type)})}})}
function onData(m){if(m.t=="join"&&S.mode=="host"){NET.send({t:"start",role:S.role});begin()}
else if(m.t=="start"&&S.mode=="guest"){S.role=m.role=="B"?"G":"B";begin()}
else if(m.t=="pick"){S.theirs[m.id]={o:m.o,r:m.r};if(S.cur&&S.cur.id==m.id&&S.mine[m.id]&&!S.done[m.id])reveal()}
else if(m.t=="again"){begin()}}
function onClose(){if(!S.online)return;S.online=false;var w=document.createElement("div");w.className="warn";w.textContent="Your partner disconnected. The game continues with an AI partner.";app.insertBefore(w,app.firstChild);if(S.cur&&S.mine[S.cur.id]&&!S.theirs[S.cur.id]){S.theirs[S.cur.id]=ai(S.cur);reveal();app.insertBefore(w,app.firstChild)}else if(S.cur&&!S.theirs[S.cur.id])S.theirs[S.cur.id]=ai(S.cur)}
function replayOnline(){if(NET)NET.send({t:"again"});begin()}

/* ===================== BOOT ===================== */
rs();stageHome();requestAnimationFrame(frame);
var qm=location.search.match(/room=([A-Za-z0-9]{4})/);if(qm){fresh();joinUI(qm[1].toUpperCase())}else home();
</script>
