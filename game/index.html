if(ks.length==1){var dx=e.clientX-pt.x,dy=e.clientY-pt.y;man.mv+=Math.abs(dx)+Math.abs(dy);if(man.mv>8)manMove(dx,dy);pt.x=e.clientX;pt.y=e.clientY}
else if(ks.length==2){pt.x=e.clientX;pt.y=e.clientY;var a=man.ptr[ks[0]],b=man.ptr[ks[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(man.d0>0&&d>0){manZoom(d/man.d0)}man.d0=d}});
